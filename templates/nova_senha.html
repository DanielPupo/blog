{% extends 'base.html' %}
{% block conteudo %}
<section class="auth-layout shell auth-layout-single">
  <form class="auth-card" action="{{ url_for('novasenha') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">SEGURANÇA</p>
    <h1>Alterar senha</h1>
    <label for="senha">Nova senha</label>
    <input id="senha" type="password" name="senha" minlength="8" autocomplete="new-password" required>
    <label for="confirmacao">Confirmar nova senha</label>
    <input id="confirmacao" type="password" name="confirmacao" minlength="8" autocomplete="new-password" required>
    <button class="button button-primary" type="submit">Atualizar senha</button>
  </form>
</section>
{% endblock %}
