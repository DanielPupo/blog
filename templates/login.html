{% extends 'base.html' %}
{% block conteudo %}
<section class="auth-layout shell">
  <div class="auth-intro">
    <p class="eyebrow">BEM-VINDO DE VOLTA</p>
    <h1>Continue a conversa.</h1>
    <p>Entre para publicar, editar seus textos e manter seu perfil.</p>
  </div>
  <form class="auth-card" action="{{ url_for('login') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2>Entrar</h2>
    <label for="user">Usuário</label>
    <input id="user" type="text" name="user" maxlength="15" autocomplete="username" required autofocus>
    <label for="password">Senha</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="button button-primary" type="submit">Entrar</button>
    <p>Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
  </form>
</section>
{% endblock %}
