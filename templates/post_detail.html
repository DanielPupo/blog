{% extends 'base.html' %}
{% block og_type %}article{% endblock %}
{% block conteudo %}
<article class="article shell" data-article>
  <a class="back-link" href="{{ url_for('index') }}">← Voltar para todos os textos</a>
  <header class="article-header">
    <p class="eyebrow">ARTIGO</p>
    <h1>{{ post.title }}</h1>
    <div class="article-byline">
      <img src="{{ url_for('profile_image', filename=post.picture or 'placeholder.svg') }}" alt="" width="48" height="48">
      <div>
        <strong>@{{ post.user }}</strong>
        <time datetime="{{ post.datePost.isoformat() }}">{{ post.datePost.strftime('%d de %m de %Y · %H:%M') }}</time>
      </div>
    </div>
  </header>
  <div class="article-body">{{ post.content }}</div>
</article>
{% endblock %}
